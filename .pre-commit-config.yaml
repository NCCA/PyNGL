repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (same source checks as CI)
        entry: uv run --locked ruff check src/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
