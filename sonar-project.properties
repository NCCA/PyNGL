sonar.projectKey=NCCA_PyNGL
sonar.organization=ncca
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Source directories
sonar.sources=src
sonar.tests=tests

# Exclusions for source analysis
sonar.coverage.exclusions=**/tests/**,**/*test*.py
# Test exclusions (files that shouldn't be analyzed as source)
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.pyc/*widget*.py

# Python specific
sonar.python.coverage.reportPaths=coverage.xml

# Coverage exclusions - don't calculate coverage for these
sonar.cpd.exclusions=**/tests/**/*widget*.py
