name: Sonar Scanner
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QUICK_BACKEND: software
      WGPU_BACKEND_TYPE: Vulkan
      PYTHONUNBUFFERED: "1"
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install software graphics and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libvulkan1 mesa-vulkan-drivers vulkan-tools libglib2.0-0t64 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Select the software Vulkan driver
        shell: bash
        run: |
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          echo "VK_DRIVER_FILES=${drivers[0]}" >> "$GITHUB_ENV"
          runtime_dir="$RUNNER_TEMP/pyngl-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Check software Vulkan and WebGPU device creation
        run: |
          vulkaninfo --summary
          uv run python -u - <<'PYTHON'
          import logging
          import wgpu.utils

          logging.basicConfig(level=logging.INFO)
          logging.getLogger("wgpu").setLevel(logging.DEBUG)
          device = wgpu.utils.get_default_device()
          info = dict(device.adapter.info)
          print("WebGPU CI adapter:", info, flush=True)
          assert info["backend_type"] == "Vulkan", info
          assert info["adapter_type"] == "CPU", info
          PYTHON

      - name: Run full-suite coverage with software graphics
        run: xvfb-run -a uv run python run_coverage_nogpu.py

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
