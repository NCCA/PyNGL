name: Sonar Scanner
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QUICK_BACKEND: software
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install software graphics and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libvulkan1 mesa-vulkan-drivers libglib2.0-0t64 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run full-suite coverage with software graphics
        run: xvfb-run -a uv run python run_coverage_nogpu.py

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
