[project]
name = "ncca-ngl"
version = "1.0.2"
description = "A Python version of the NGL graphics library."
authors = [{ name = "Jon Macey", email = "jmacey@bournemouth.ac.uk" }]
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }

dependencies = [
    "numpy>=2.3.3",
    "PyOpenGL",
    "Pillow",
    "glfw>=2.9.0",
    "freetype-py>=2.5.1",
    "pyside6>=6.9.2",
    "wgpu>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/NCCA/PyNGL"
Issues = "https://github.com/NCCA/PyNGL/issues"


[tool.pytest.ini_options]
pythonpath = ["src","tests"]

[tool.ruff.lint]
extend-select = [
    "ANN", # flake8-annotations: require type hints on signatures
    "D",   # pydocstyle: require/validate docstrings
]
ignore = [
    "D203",   # incompatible with D211 (no-blank-line-before-class)
    "D213",   # incompatible with D212 (multi-line-summary-first-line)
    "ANN401", # Any is a deliberate choice at math/shader-uniform bridge points
              # (e.g. cross-type Vec/Mat operators, GLSL uniform setters)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ncca.ngl"
module-root = "src"
# The loose PrimData/*.npy meshes are the *sources* pack_arrays.py bakes into
# Primitives.npz, which is the only thing prim_data.py ever loads. They stay in
# the repo so the .npz can be rebuilt, but shipping both put ~14MB of dead
# weight in every wheel.
wheel-exclude = ["PrimData/*.npy"]


[dependency-groups]
dev = [
    "coverage>=7.10.6",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "pre-commit>=4.3.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=0.30.1",
    "mkdocs-material>=9.7.0",
    "pytest-qt>=4.5.0",
]

[tool.coverage.run]
source = ["src/ncca/ngl"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "__main__.py",
    "__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
